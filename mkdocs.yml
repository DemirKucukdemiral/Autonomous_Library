site_name: Autonomous Systems Handbook
site_description: Documentation on Robotics, Control Theory and Autonomous Systems
site_author: Demir Kucukdemiral

site_url: https://demirkucukdemiral.github.io/Autonomous_Library/

repo_url: https://github.com/demirkucukdemiral/Autonomous_Library
repo_name: demirkucukdemiral/Autonomous_Library

theme:
  name: material

  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
